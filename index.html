<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <div id="loginPage">

    <h1>Product Manager</h1>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <button id="signupBtn">Create Account</button>

</div>

<div class="app" style="display:none;">
  
  <div class="app" style="display:none;">
    
  <h1>Product Manager</h1>
    
    <p class="subtitle">Manage your products using JavaScript and Local Storage</p>
    
    <div class="form-box">
    
  <input type="text" id="productName" placeholder="Product Name">
      
   <input type="number" id="productPrice" placeholder="Product Price">
    
  <input type="number" id="productQuantity" placeholder="Product Quantity">
      
   <input type="file" id="productImage" accept="image/*">
      
    <select id="productCategory">
    <option value="">Choose a Category</option>
    <option value="Electronics">Electronics</option>
    <option value="Clothes">Clothes</option>
    <option value="Food">Food</option>
    <option value="Books">Books</option>
</select>  
    
      
  <button id="saveBtn" type="button">Save Product</button>
   <button id="resetBtn" type="button">Reset Form</button>
   <button id="clearBtn" type="button">Clear All Products</button>   
    
  <p id="message"></p>
    </div>
    
    <div class="stats">
    <div class="stat-card">
        <h3>Total Products</h3>
        <p id="totalProducts">0</p>
    </div>

    <div class="stat-card">
        <h3>Total Quantity</h3>
        <p id="totalQuantity">0</p>
    </div>

    <div class="stat-card">
        <h3>Total Inventory Value</h3>
        <p id="totalValue">$0</p>
    </div>
</div>
    
  <div class="list-box">
    <input type="text" id="searchInput" placeholder="Search by product name">
   
    <select id="sortSelect">
    <option value="">Sort Products</option>
    <option value="name">Name (A-Z)</option>
    <option value="priceLow">Price (Low → High)</option>
    <option value="priceHigh">Price (High → Low)</option>
    <option value="quantityLow">Quantity (Low → High)</option>
    <option value="quantityHigh">Quantity (High → Low)</option>
</select>
    
    <h2>Products</h2>  
    
  <div id="productList"></div>
   </div>
 </div>
  
  <script type="module" src="script.js"></script>
</body>
</html>
